services:
  mysql:
    image: mysql:8.4
    container_name: chess_ai_bot_mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chess_ai_bot}
      MYSQL_USER: ${MYSQL_USER:-chess_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-chess_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: chess_ai_bot_app
    restart: unless-stopped
    working_dir: /workspace

    volumes:
      - .:/workspace

    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chess_ai_bot}
      MYSQL_USER: ${MYSQL_USER:-chess_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-chess_password}

      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-chess_user}:${MYSQL_PASSWORD:-chess_password}@mysql:3306/${MYSQL_DATABASE:-chess_ai_bot}?charset=utf8mb4

      PYTHONPATH: /workspace/src
      PYTHONUNBUFFERED: 1

    depends_on:
      mysql:
        condition: service_healthy

    command: ["tail", "-f", "/dev/null"]

    stdin_open: true
    tty: true

volumes:
  mysql_data: